name: Build containers (reusable workflow)

on:
  workflow_call:
    inputs:
      environment-name:
        required: true
        type: string

env:
  BRANCH_NAME: >-
    ${{ github.event.pull_request.number && 'PR-' }}${{ github.event.pull_request.number || github.ref_name }}
  PUBLISH_CONTAINER: 1

jobs:
  display-message:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment-name }}
    steps:
      - shell: bash
        run: |
          echo "Container job approved to run"

  build-containers:
    name: Build CI containers (${{ matrix.image_repo }})
    runs-on:
      - runs-on
      - runner=${{ matrix.runner }}
      - run-id=${{ github.run_id }}
      - tag=build-containers-${{ matrix.image_repo }}
    needs: display-message
    strategy:
      fail-fast: false
      matrix:
        image_repo:
          - xgb-ci.cpu
          - xgb-ci.cpu_build_r_doc
          - xgb-ci.gpu
          - xgb-ci.gpu_cuda12
          - xgb-ci.gpu_build_r_rockylinux8
          - xgb-ci.gpu_build_rockylinux8
          - xgb-ci.gpu_build_cuda12_rockylinux8
          - xgb-ci.jvm
          - xgb-ci.jvm_gpu_build
          - xgb-ci.manylinux_2_28_x86_64
          - xgb-ci.i386
        runner: [linux-amd64-cpu]
        include:
          - image_repo: xgb-ci.manylinux_2_28_aarch64
            runner: linux-arm64-cpu
          - image_repo: xgb-ci.gpu_build_rockylinux8_aarch64
            runner: linux-arm64-cpu
          - image_repo: xgb-ci.gpu_build_cuda12_rockylinux8_aarch64
            runner: linux-arm64-cpu
          - image_repo: xgb-ci.cpu_aarch64
            runner: linux-arm64-cpu
          - image_repo: xgb-ci.gpu_aarch64
            runner: linux-arm64-cpu
          - image_repo: xgb-ci.gpu_cuda12_aarch64
            runner: linux-arm64-cpu
    steps:
      - run: sudo systemctl restart docker
      - uses: actions/checkout@v7
        with:
          submodules: "true"
      - name: Build ${{ matrix.image_repo }}
        run: bash containers/docker_build.sh ${{ matrix.image_repo }}

  # ↓↓↓ ADD THIS NEW JOB ↓↓↓
  build-ppc64le:
    name: Build CI container (xgb-ci.manylinux_2_34_ppc64le)
    runs-on: [self-hosted, linux, ppc64le]
    needs: display-message
    env:
      PUBLISH_CONTAINER: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_ppc64le
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Build xgb-ci.manylinux_2_34_ppc64le
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash containers/docker_build.sh xgb-ci.manylinux_2_34_ppc64le